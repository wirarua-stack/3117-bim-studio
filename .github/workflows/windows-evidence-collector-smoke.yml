name: Windows evidence collector smoke

on:
  workflow_dispatch:
  push:
    branches:
      - acceptance/windows-history-fix
    paths:
      - scripts/Collect-WindowsEvidence.ps1
      - tests/Test-WindowsEvidenceCollection.ps1
      - .github/workflows/windows-acceptance.yml
      - .github/workflows/windows-evidence-collector-smoke.yml

permissions:
  contents: read

jobs:
  synthetic-evidence-copy:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact test commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy complete, partial, and missing original evidence without FreeCAD
        run: |
          ./tests/Test-WindowsEvidenceCollection.ps1 -EvidenceRoot (Join-Path $env:GITHUB_WORKSPACE 'artifact-staging/evidence-copy-smoke')
      - name: Retain synthetic copy validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-evidence-copy-smoke-${{ github.run_id }}
          path: artifact-staging/evidence-copy-smoke/
          if-no-files-found: warn
          retention-days: 7

# This smoke test validates evidence copying only, not FreeCAD or acceptance.
