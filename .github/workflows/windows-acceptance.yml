name: 3117 Windows acceptance / patched FreeCAD 1.1.4

run-name: Windows history fix / ${{ github.ref_name }} / ${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Windows runner (desktop requires an existing labelled interactive runner)'
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - desktop
  push:
    branches:
      - acceptance/windows-history-fix
    paths:
      - 'build/**'
      - 'scripts/**'
      - 'inputs/**'
      - 'tests/**'
      - 'inputs.lock.json'
      - 'Start-WindowsAcceptance.ps1'
      - '.github/workflows/windows-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: bim3117-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ${{ inputs.runner == 'desktop' && fromJSON('["self-hosted","Windows","X64","3117-desktop"]') || 'windows-2022' }}
    timeout-minutes: 355
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Initialize evidence paths on the assigned runner
        run: |
          $preflight = Join-Path $env:RUNNER_TEMP "3117-runner-preflight-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $fallbackRoot = Join-Path $env:RUNNER_TEMP "3117-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "BIM3117_RUNNER_PREFLIGHT=$preflight" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIM3117_ACCEPTANCE_ROOT=$fallbackRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the exact acceptance commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure capacity and observe the Windows desktop before building
        run: |
          ./scripts/Prepare-WindowsRunner.ps1 -EvidencePath $env:BIM3117_RUNNER_PREFLIGHT

      - name: Set up independent controller Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate acceptance logic before compiling
        run: |
          ./tests/Test-RunnerPreparation.ps1
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance controller unit checks failed' }
          python -m unittest discover -s build -p test_build.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Build driver unit checks failed' }
          python scripts/run_acceptance.py --work-root "$env:RUNNER_TEMP/3117-preflight-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'Frozen input hashes did not match' }

      - name: Build unpatched and patched hosts; run complete Windows suites
        run: |
          ./Start-WindowsAcceptance.ps1 -WorkRoot $env:BIM3117_ACCEPTANCE_ROOT -Jobs 2 -PythonExe (Get-Command python).Source

      - name: Seal the exact accepted patched runtime for trial packaging
        if: success()
        run: |
          $reportPath = Join-Path $env:BIM3117_ACCEPTANCE_ROOT 'WINDOWS_ACCEPTANCE.json'
          $hostManifestPath = Join-Path $env:BIM3117_ACCEPTANCE_ROOT 'hosts/patched/host-manifest.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw "Acceptance report missing: $reportPath" }
          if (-not (Test-Path -LiteralPath $hostManifestPath -PathType Leaf)) { throw "Patched host manifest missing: $hostManifestPath" }

          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($report.status -ne 'passed' -or -not $report.windows_automated_acceptance_passed) {
            throw 'Refusing to retain a trial runtime because automated Windows acceptance did not pass.'
          }
          if ($report.release_ready) { throw 'Automated acceptance must not set release_ready=true.' }

          $host = Get-Content -LiteralPath $hostManifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($host.variant -ne 'patched') { throw 'Expected the patched host manifest.' }
          $buildRoot = [IO.Path]::GetFullPath([string]$host.host_root)
          $expectedBuildRoot = [IO.Path]::GetFullPath((Join-Path $env:BIM3117_ACCEPTANCE_ROOT 'hosts/patched/build'))
          if ($buildRoot -ne $expectedBuildRoot) {
            throw "Patched host root is not the tested build tree. Expected $expectedBuildRoot; got $buildRoot"
          }

          $runtimeFamilies = @('bin','data','doc','Ext','lib','Mod')
          $missing = @($runtimeFamilies | Where-Object { -not (Test-Path -LiteralPath (Join-Path $buildRoot $_) -PathType Container) })
          if ($missing.Count -gt 0) { throw "Accepted runtime directories missing: $($missing -join ', ')" }

          $sealRoot = Join-Path $env:BIM3117_ACCEPTANCE_ROOT 'accepted-runtime-seal'
          New-Item -ItemType Directory -Path $sealRoot -Force | Out-Null
          $records = foreach ($family in $runtimeFamilies) {
            $familyRoot = Join-Path $buildRoot $family
            Get-ChildItem -LiteralPath $familyRoot -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($buildRoot, $_.FullName).Replace('\\','/')
              [ordered]@{
                path = $relative
                bytes = $_.Length
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          }
          if (@($records).Count -eq 0) { throw 'Accepted runtime seal would be empty.' }

          $seal = [ordered]@{
            schema = 1
            purpose = 'Exact patched FreeCAD runtime retained from the host that passed automated Windows acceptance'
            source_run_id = $env:GITHUB_RUN_ID
            source_run_attempt = $env:GITHUB_RUN_ATTEMPT
            source_commit = $env:GITHUB_SHA
            accepted_host_manifest = [ordered]@{
              path = 'hosts/patched/host-manifest.json'
              sha256 = (Get-FileHash -LiteralPath $hostManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            acceptance_report = [ordered]@{
              path = 'WINDOWS_ACCEPTANCE.json'
              sha256 = (Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            runtime_root = 'hosts/patched/build'
            runtime_families = $runtimeFamilies
            files = @($records)
            release_ready = $false
          }
          $sealPath = Join-Path $sealRoot 'accepted-runtime-manifest.json'
          $seal | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $sealPath -Encoding utf8
          "BIM3117_ACCEPTED_RUNTIME_SEAL=$sealPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Retain the exact patched runtime that passed automated acceptance
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3117-accepted-patched-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/bin/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/data/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/doc/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/Ext/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/lib/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/build/Mod/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/patched/host-manifest.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/WINDOWS_ACCEPTANCE.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/accepted-runtime-seal/accepted-runtime-manifest.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/ifc-runtime/
            inputs/3117_BIM_Studio_v0_5_0_FreeCAD.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve original evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3117-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BIM3117_RUNNER_PREFLIGHT }}
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/run.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/preflight.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/WINDOWS_ACCEPTANCE.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/WINDOWS_ACCEPTANCE.md
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/controller-logs/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/results/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/host-manifest.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/source-integrity.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/build-status.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/logs/
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/build/CMakeCache.txt
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/hosts/*/build/src/Gui/FreeCADGui.vcxproj
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/ifc-runtime/ifc-*.json
            ${{ env.BIM3117_ACCEPTANCE_ROOT }}/ifc-runtime/_preflight/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

# No release, installer, upstream PR or merge is performed by this workflow.
# Actual Qt desktop checks fail closed if the selected runner has no usable desktop.
