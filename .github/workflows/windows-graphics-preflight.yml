name: Windows graphics capability preflight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Explicitly select the graphical Windows runner'
        type: choice
        default: desktop
        options:
          - desktop
          - windows-2022

permissions:
  contents: read

jobs:
  opengl-preflight:
    runs-on: ${{ inputs.runner == 'desktop' && fromJSON('["self-hosted","Windows","X64","3117-desktop"]') || 'windows-2022' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out qualification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure Windows capacity and observe real desktop session
        run: |
          $preflight = Join-Path $env:GITHUB_WORKSPACE 'graphics-evidence/runner-preflight.json'
          ./scripts/Prepare-WindowsRunner.ps1 -EvidencePath $preflight
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Inspect actual WGL OpenGL context, vendor and renderer
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'graphics-evidence/opengl.json'
          python diagnostics/probe_windows_opengl.py --output "$output"
          if ($LASTEXITCODE -ne 0) { throw 'Could not record OpenGL probe output.' }
      - name: Fail closed unless interactive desktop and GPU capability qualify
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'graphics-evidence'
          python diagnostics/qualify_windows_runner.py --runner-preflight (Join-Path $dir 'runner-preflight.json') --opengl (Join-Path $dir 'opengl.json') --output (Join-Path $dir 'runner-qualification.json') --expected-run-id "$env:GITHUB_RUN_ID" --expected-run-attempt "$env:GITHUB_RUN_ATTEMPT" --expected-sha "$env:GITHUB_SHA" --expected-repository "$env:GITHUB_REPOSITORY" --require-qualified
          if ($LASTEXITCODE -ne 0) { throw 'Runner not qualified; no FreeCAD build or acceptance was run.' }
      - name: Retain all runner qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-gpu-preflight-${{ github.run_id }}
          path: graphics-evidence/
          if-no-files-found: warn
          retention-days: 7

# Runner readiness only: neither FreeCAD GUI tests nor release approval.
